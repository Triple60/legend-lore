name: Keep Supabase awake

# Supabase pauses free-tier projects after about a week without activity.
# This makes one tiny database query every three days so a break between
# sessions doesn't take the campaign offline. Each run takes seconds.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLIC_SUPABASE_URL != '' }}
    steps:
      - name: Query the database
        env:
          URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Anonymous callers can't see any rows (RLS), but the request still
          # runs a real query against Postgres, which is what counts.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/campaigns?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $status"
          test "$status" = 200
